name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The domain and application layers are platform-neutral by design, so the logic that matters
    # is tested on the cheaper runner.
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # One project per invocation: the .NET CLI rejects several at once with MSB1008.
      - name: Test domain
        run: dotnet test tests/Crapnet.Domain.Tests --configuration Release --logger "console;verbosity=normal"
      - name: Test application
        run: dotnet test tests/Crapnet.Application.Tests --configuration Release --logger "console;verbosity=normal"

  build:
    name: build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Publish
        run: dotnet publish src/Crapnet.App --configuration Release --runtime win-x64 --self-contained false --output publish
      - name: Check WinDivert was published
        shell: pwsh
        run: |
          foreach ($f in 'WinDivert.dll', 'WinDivert64.sys') {
            if (-not (Test-Path "publish/$f")) { throw "$f is missing from the publish output." }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: crapnet-win-x64
          path: publish
